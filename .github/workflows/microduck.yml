name: MicroDuck inference contracts
on: [push, pull_request]
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6 pillow==12.0.0 pytest==8.4.2 imageio==2.37.0
      - name: CPU contracts (not GPU or task acceptance)
        env:
          PYTHONPATH: .:embodied/microduck/src
          LIGHTX2V_IMPORT_MODE: robotics
        run: python -m pytest -q tests embodied/microduck/tests -m 'not integration'
